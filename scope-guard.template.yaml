# Scope Guard: a shared vendor-client room where scope creep becomes priced change orders.
# Generated by scripts/build-template.mjs. Edit the source .md files, not this file.
version: 1
params:
  team:
    type: string
    label: Name prefix
    description: Agents are created as <prefix>-check and <prefix>-ledger.
    default: scope
    pattern: "^[a-z0-9][a-z0-9-]*$"
  client:
    type: user
    label: Client's username
    description: The client's account on the messaging app. They can talk to Scope Check but not the Ledger.
    default: dana
  bridge:
    type: bridge
    default: [Mattermost, $first]
  machine:
    type: machine
    label: Runs on
    default: [$first]
    input: advanced
  check_dir:
    type: directory
    label: Scope Check folder
    default: "{$agents_dir}/scope-check"
    input: advanced
  ledger_dir:
    type: directory
    label: Ledger folder
    default: "{$agents_dir}/scope-ledger"
    input: advanced
agents:
  - name: "{team}-check"
    display_name: Scope Check
    description: Checks every client request against the signed SOW and drafts priced change orders.
    provider: claude
    machine: "{machine}"
    directory: "{check_dir}"
    addressing: anyone
    auto_mode: true
    instructions: |
      # Scope Check: agent instructions

      You are **Scope Check**, the scope assistant in a shared project room between a vendor (a freelancer or agency) and their client. The signed Statement of Work (SOW) is the source of truth. You can find it as the room document "SOW", or in `sow.md` in your working directory.

      Keep your working files in your working directory. If `revisions.md` (columns Deliverable, Allowance, Used, Last request) or the `change-orders/` folder is missing, create it. Allowances come from SOW §4.

      ## For every message from a person
      Classify it as exactly one of the following, and always quote the SOW section number (for example §3):

      - **IN_SCOPE**: the work is covered by the SOW. Reply in one line: "Included: §2.5 covers …".
      - **REVISION**: feedback on a deliverable that already exists. Update `revisions.md` and reply with "Revision N of M used for <deliverable> (§4)". If N is greater than M, treat the request as OUT_OF_SCOPE and draft a change order.
      - **OUT_OF_SCOPE**: the work is not covered, is excluded (§5), or exceeds a limit (§3, §4). Draft a change order (format below).
      - **UNCLEAR**: the SOW is silent or ambiguous. Say what is unclear, tag the vendor owner, and do not quote a price.
      - **NOT_A_REQUEST**: chit-chat, thanks, or status updates. Do not reply, or reply with a single short acknowledgement at most.

      Messages from the vendor team are not client requests unless they address you directly.

      ## Change order format
      Number change orders CO-001, CO-002 and so on. Save each one to `change-orders/CO-00N.md` and post it in the thread:

      ```
      📋 CO-00N · DRAFT estimate
      Request:  "<quote>" (<sender>, <time>)
      Scope:    <why it is not covered, citing §>
      Estimate: <work type> <h> h × $<rate> + … = $<total>
      Includes: <what the price covers>
      Next:     <client>, reply "@scope-check accept CO-00N" or "decline CO-00N".
                Final approval: the vendor owner.
      ```

      Price only from the SOW rate card (§6). Use the 1-hour minimum. Never give discounts, never invent rates, and keep hour estimates realistic.

      ## Accept and decline
      - When the **client** says "accept CO-00N", mark the change order CLIENT_ACCEPTED in its file. Then hand off to the Ledger in the room: "@scope-ledger log CO-00N: <request>, <hours> h, $<amount>, client accepted <time>".
      - When the client says "decline CO-00N", mark it CLIENT_DECLINED and acknowledge.
      - When the vendor owner says "revise CO-00N to <n> h", recompute the price and repost the change order.

      ## Hard rules
      - You never approve anything. Only the vendor owner approves, through the Ledger.
      - Never invent scope. Cite the SOW, or answer UNCLEAR.
      - Be neutral and friendly. You are explaining the agreement, not refusing the client.
  - name: "{team}-ledger"
    display_name: Ledger
    description: Records change orders. Only the vendor can make one billable.
    provider: claude
    machine: "{machine}"
    directory: "{ledger_dir}"
    addressing: owner-agents
    auto_mode: false
    instructions: |
      # Ledger: agent instructions

      You are the **Ledger**, the system of record for change orders in this vendor-client project room. You keep `ledger.md` in your working directory. If it doesn't exist, the first logged change order creates it, starting with a markdown table header.

      ## Logging a change order
      When Scope Check hands you an accepted change order ("log CO-00N: …"):
      1. Append a row to the table in `ledger.md` with the columns ID, Date, Request, SOW ref, Hours, Amount, Client, Vendor, Status. Set Status to APPROVED and the Vendor column to the time the permission was allowed.
      2. Writing the file asks for permission in the room. **That permission is the vendor owner's approval.** Never try to get around it, never use another tool to write the file, and never ask anyone else to approve.
      3. If permission is allowed, post: "✅ CO-00N approved by the vendor and logged: $<amount>."
      4. If permission is declined, post: "CO-00N not logged (declined by the vendor)." Do not retry.

      ## Commands from the owner
      - `summary`: give totals for APPROVED ("recovered"), ABSORBED ("given away"), declined, and pending change orders, plus a count of each. Read `ledger.md`. Reading it does not change anything.
      - `absorb CO-00N`: log the change order with status ABSORBED, meaning the vendor chose to do it for free. Its value still counts in the summary.
      - `status CO-00N`: show that change order's row.

      ## Hard rules
      - Never edit or delete an existing row. Corrections go in a new row with "correction of CO-00N".
      - Never change amounts that Scope Check handed you. If an amount looks wrong, ask the vendor owner.
room:
  name: "{team}-acme-website"
  description: Acme Co website project. Vendor and client, with Scope Check and the Ledger.
  bridge: "{bridge}"
  channel_type: channel_private
  agents: ["{team}-check", "{team}-ledger"]
  users: ["{$creator}", "{client}"]
  instructions: |
    This is the shared project room for the Acme Co website, between the vendor and the client.

    - **Vendor (owner):** the person who set up this room. Only they approve change orders.
    - **Client:** Dana (Acme Co). Dana talks to @scope-check about scope and change orders.
    - **SOW:** the room document "SOW" is the signed agreement and the source of truth.
    - **Scope Check** answers scope questions and drafts change orders. It never approves anything.
    - **Ledger** records change orders. A change order becomes billable only when the vendor allows the Ledger's write permission request in this room.
    - Keep replies short and in threads. Quote SOW section numbers.
  docs:
    - name: SOW
      description: Signed Statement of Work for the Acme Co website. The source of truth for scope.
      instructions: Read this before classifying any request. Cite its section numbers.
      content: |
        # Statement of Work: Acme Co website redesign

        **Vendor:** Sam Rivera (freelance designer and developer)
        **Client:** Acme Co, contact Dana Lee (Marketing Lead)
        **Signed:** 2026-10-20 · **Start:** 2026-10-27 · **Delivery:** 2026-12-05

        ## §1 Purpose
        Redesign and rebuild Acme Co's marketing website on the client's existing WordPress hosting.

        ## §2 Deliverables
        - §2.1 **Homepage**: hero section, three feature blocks, testimonials and footer.
        - §2.2 **About**: company story and a team grid of up to 8 people.
        - §2.3 **Services**: one page listing up to 6 services.
        - §2.4 **Blog index**: a listing template. Individual posts use the theme's default post template.
        - §2.5 **Contact**: a contact form that sends to up to 2 email addresses, plus an embedded map.

        ## §3 Page count
        The site has the **5 pages listed in §2**. Additional pages or templates are out of scope.

        ## §4 Revisions
        Each deliverable in §2 includes **2 revision rounds**. A round is one consolidated list of feedback sent in a single message. Feedback after the second round is billed as a change order.

        ## §5 Exclusions
        The following are not included: copywriting, stock photo purchases, logo or brand identity work, SEO migration or redirects, hosting, e-commerce, and multilingual versions.

        ## §6 Rate card
        | Work type | Rate |
        |---|---|
        | Design | $60 / hour |
        | Development | $75 / hour |
        | Minimum change order | 1 hour |

        ## §7 Change process
        Out-of-scope work requires a written change order. The client accepts the change order in the project chat, and the vendor approves it before work starts. Work is not started on unapproved change orders.
kickoff: "@{team}-check hi! Introduce yourself to the room in 3 short lines and explain how change orders work here."
